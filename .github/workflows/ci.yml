name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Un merge que sólo toca documentación no tiene nada nuevo que desplegar: no dispara la cadena
    # (y no hay que rechazar un deploy a PROD por un .md). Los PRs siguen corriendo siempre,
    # porque la protección de main exige sus checks.
    paths-ignore:
      - "**.md"

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # sólo este job publica el paquete: mínimo privilegio, por job y no a nivel workflow

    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      # Los tests y el umbral de cobertura (/p:Threshold) están en el ENTRYPOINT de la etapa
      # `test` del Dockerfile: si la cobertura baja del número declarado, este paso sale con
      # error y el job queda rojo aunque todos los tests pasen.
      - name: Correr los tests del backend con coverage
        run: |
          docker run --rm -v "${{ github.workspace }}/TestResults:/out" backend-test:ci \
            --collect:"XPlat Code Coverage"

      # El filtro es el MISMO recorte que el /p:Exclude del Dockerfile (arranque, datos, modelos,
      # migraciones), para que el Summary y el umbral midan lo mismo.
      - name: Reporte de coverage del backend
        if: ${{ !cancelled() }}
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/*/coverage.cobertura.xml" -sourcedirs:backend \
            -targetdir:coveragereport "-reporttypes:Html;MarkdownSummaryGithub" \
            "-classfilters:-Program*;-LasMelis.Api.Data.*;-LasMelis.Api.Models.*;-LasMelis.Api.Migrations.*"
          cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del backend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: |
            coveragereport
            TestResults/tests.trx

      # --- Publicar el artefacto: lo ÚLTIMO del job, después de los tests ---
      # No hay ningún `if` que diga "si los tests pasaron": no hace falta. Los pasos corren en
      # orden y se cortan al primer error, así que si los tests fallan el job muere antes de
      # llegar acá. Y estos dos pasos no llevan `!cancelled()` a propósito.
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Se construye siempre (así un PR también verifica que la imagen final arma), pero sólo
      # se PUBLICA cuando el cambio ya entró a main. Nombre en minúsculas, escrito a mano:
      # el registry no acepta mayúsculas y el repo se llama Pagina-ing3.
      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/julietamelinsky01/pagina-ing3-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      # `npm run test:ci` (ENTRYPOINT de la etapa) mide coverage y aplica los `thresholds` de
      # vite.config.js: bajo el umbral sale con error aunque los tests pasen.
      - name: Correr los tests del frontend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      # --- Publicar el artefacto: lo ÚLTIMO del job, después de los tests (ver el job del backend) ---
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/julietamelinsky01/pagina-ing3-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # --- Promoción a QA: arranca donde termina la verificación ---
  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]     # sin CI verde no hay deploy
    if: github.ref == 'refs/heads/main'        # los PRs verifican; sólo main despliega
    environment: qa                            # hereda los secrets de QA (los deploy hooks) y suma al historial de Deployments
    steps:
      # Desde el TP7 el hook ya no dice QUÉ COMMIT construir sino QUÉ IMAGEN ejecutar: Render
      # no compila nada, baja de ghcr.io la imagen que ESTA corrida construyó y publicó
      # (sha-<commit>). El `&ref=` se saca a propósito: con una imagen no hay nada que construir.
      # El hook ya trae un `?key=…`; --get --data-urlencode agrega `imgURL` con `&` y le codifica
      # los `:` y `/`. La URL del hook va ÚLTIMA: es el único argumento suelto de curl.
      # Ojo con los nombres: la api lleva -backend y el front -frontend; con el nombre cruzado
      # Render contesta 400 («cannot change the host, project, or image name»).
      - name: Desplegar en QA la IMAGEN del commit (api + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          IMG_API="ghcr.io/julietamelinsky01/pagina-ing3-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/julietamelinsky01/pagina-ing3-frontend:sha-${{ github.sha }}"
          echo "imagen api:   $IMG_API"
          echo "imagen front: $IMG_FRONT"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"; echo
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"; echo

      # Reintenta (30 x 20 s) porque el plan gratis de Render duerme el servicio y tarda en
      # construir y despertar (cold start). Un curl seco daría falsos rojos. Verifica tres cosas:
      #   1. /health del backend: el proceso vive Y la base responde (200).
      #   2. el front sirve la página (200).
      #   3. el front llega al backend por el proxy de nginx: /api/empleados SIN token tiene que
      #      contestar 401 (si el proxy estuviera roto daría 502/504/404).
      # Limitación: el hook responde al instante y Render baja la imagen en segundo plano; mientras
      # tanto (o si ese deploy falla) sigue sirviendo la versión ANTERIOR, así que este smoke
      # puede dar verde contra la versión vieja. Prueba que el entorno contesta, no qué imagen corre:
      # eso se mira en los Events de cada servicio (debe nombrar el sha- de esta corrida).
      - name: Smoke test (espera a que QA conteste)
        shell: bash
        env:
          URL_API: https://pagina-ing3-api-qa.onrender.com
          URL_FRONT: https://pagina-ing3-front-qa.onrender.com
        run: |
          echo "Esperando a que QA esté vivo..."
          for i in $(seq 1 30); do
            api=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL_API/health" || true)
            front=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL_FRONT/" || true)
            proxy=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL_FRONT/api/empleados" || true)
            echo "intento $i: health=$api front=$front proxy=$proxy"
            if [ "$api" = "200" ] && [ "$front" = "200" ] && [ "$proxy" = "401" ]; then
              echo "✅ QA responde (API + BD + front + proxy)"; exit 0
            fi
            sleep 20
          done
          echo "❌ QA no respondió a tiempo"; exit 1

  # --- Las dos suites contra QA: integración (api) y e2e (navegador), en ese orden ---
  integracion:
    runs-on: ubuntu-latest
    needs: deploy-qa                           # QA ya está ejecutando la imagen de ESTA corrida
    if: github.ref == 'refs/heads/main'
    environment: qa                            # de acá salen E2E_USER / E2E_PASSWORD (secrets del environment qa)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install (sin browser)
        run: npm ci                            # sin `playwright install`: estas pruebas no abren navegador
        working-directory: ./frontend

      # Le habla a la API de QA ya desplegada, con su base de verdad. Si una prueba falla, este
      # paso falla y la promoción se frena: no hay continue-on-error ni `|| true` a propósito.
      - name: Integración contra la api de QA
        env:
          API_BASE_URL: https://pagina-ing3-api-qa.onrender.com    # la API, no el front
          E2E_USER: ${{ secrets.E2E_USER }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test e2e/api.spec.js
        working-directory: ./frontend

      - name: Publicar reporte de integración
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}                # el reporte importa MÁS cuando falla (y no cuando cancelás)
        with:
          name: playwright-report-integracion  # distinto del de e2e: dos iguales rompen la corrida
          path: frontend/playwright-report
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: integracion                         # si la api está rota, no gastamos un browser en confirmarlo
    if: github.ref == 'refs/heads/main'
    environment: qa
    timeout-minutes: 20                        # si algo se cuelga, el job muere en vez de esperar horas
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install + browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: ./frontend

      - name: e2e contra QA
        env:
          E2E_BASE_URL: https://pagina-ing3-front-qa.onrender.com    # el FRONT de QA
          E2E_USER: ${{ secrets.E2E_USER }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test e2e/empleados.spec.js    # SU archivo: sin esto vuelve a correr la integración
        working-directory: ./frontend

      - name: Publicar reporte e2e
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report
          retention-days: 7

  # --- Promoción a PRODUCCIÓN: la misma cadena, con una puerta humana ---
  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e                                 # EL gate: sin integración y e2e verdes ni siquiera se pide aprobación
    if: github.ref == 'refs/heads/main'
    environment: production                    # acá está la aprobación: el job queda en "Waiting" hasta que un reviewer la dé
    concurrency:
      group: deploy-production                 # un solo deploy a producción a la vez
      cancel-in-progress: false                # no se cancela uno en curso: se encolan
    steps:
      # La MISMA imagen (sha-<commit>) que construyó el CI y que QA ejecutó: build once, deploy
      # many. No se reconstruye nada. Si el reviewer rechaza, estos pasos no corren y producción
      # queda intacta. Ojo con los nombres: la api lleva -backend y el front -frontend.
      - name: Desplegar en PROD la MISMA imagen (api + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          IMG_API="ghcr.io/julietamelinsky01/pagina-ing3-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/julietamelinsky01/pagina-ing3-frontend:sha-${{ github.sha }}"
          echo "imagen api:   $IMG_API"
          echo "imagen front: $IMG_FRONT"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"; echo
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"; echo

      # Mismo smoke test que en QA (reintenta por el cold start), contra las URLs de producción.
      - name: Smoke test (espera a que PROD conteste)
        shell: bash
        env:
          URL_API: https://pagina-ing3-api-prod.onrender.com
          URL_FRONT: https://pagina-ing3-front-prod.onrender.com
        run: |
          echo "Esperando a que PROD esté vivo..."
          for i in $(seq 1 30); do
            api=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL_API/health" || true)
            front=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL_FRONT/" || true)
            proxy=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL_FRONT/api/empleados" || true)
            echo "intento $i: health=$api front=$front proxy=$proxy"
            if [ "$api" = "200" ] && [ "$front" = "200" ] && [ "$proxy" = "401" ]; then
              echo "✅ PROD responde (API + BD + front + proxy)"; exit 0
            fi
            sleep 20
          done
          echo "❌ PROD no respondió a tiempo"; exit 1
