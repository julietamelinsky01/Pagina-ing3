name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # sólo este job publica el paquete: mínimo privilegio, por job y no a nivel workflow

    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      # Los tests y el umbral de cobertura (/p:Threshold) están en el ENTRYPOINT de la etapa
      # `test` del Dockerfile: si la cobertura baja del número declarado, este paso sale con
      # error y el job queda rojo aunque todos los tests pasen.
      - name: Correr los tests del backend con coverage
        run: |
          docker run --rm -v "${{ github.workspace }}/TestResults:/out" backend-test:ci \
            --collect:"XPlat Code Coverage"

      # El filtro es el MISMO recorte que el /p:Exclude del Dockerfile (arranque, datos, modelos,
      # migraciones), para que el Summary y el umbral midan lo mismo.
      - name: Reporte de coverage del backend
        if: ${{ !cancelled() }}
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/*/coverage.cobertura.xml" -sourcedirs:backend \
            -targetdir:coveragereport "-reporttypes:Html;MarkdownSummaryGithub" \
            "-classfilters:-Program*;-LasMelis.Api.Data.*;-LasMelis.Api.Models.*;-LasMelis.Api.Migrations.*"
          cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del backend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: |
            coveragereport
            TestResults/tests.trx

      # --- Publicar el artefacto: lo ÚLTIMO del job, después de los tests ---
      # No hay ningún `if` que diga "si los tests pasaron": no hace falta. Los pasos corren en
      # orden y se cortan al primer error, así que si los tests fallan el job muere antes de
      # llegar acá. Y estos dos pasos no llevan `!cancelled()` a propósito.
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Se construye siempre (así un PR también verifica que la imagen final arma), pero sólo
      # se PUBLICA cuando el cambio ya entró a main. Nombre en minúsculas, escrito a mano:
      # el registry no acepta mayúsculas y el repo se llama Pagina-ing3.
      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/julietamelinsky01/pagina-ing3-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      # `npm run test:ci` (ENTRYPOINT de la etapa) mide coverage y aplica los `thresholds` de
      # vite.config.js: bajo el umbral sale con error aunque los tests pasen.
      - name: Correr los tests del frontend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      # --- Publicar el artefacto: lo ÚLTIMO del job, después de los tests (ver el job del backend) ---
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/julietamelinsky01/pagina-ing3-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # --- Promoción a QA: arranca donde termina la verificación ---
  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]     # sin CI verde no hay deploy
    if: github.ref == 'refs/heads/main'        # los PRs verifican; sólo main despliega
    environment: qa                            # hereda los secrets de QA (los deploy hooks) y suma al historial de Deployments
    steps:
      # El `&ref=` no es opcional: un hook "pelado" despliega la PUNTA de la rama, no el commit
      # que este pipeline acaba de verificar. Con dos merges seguidos, la corrida del primero
      # desplegaría el segundo, que todavía no pasó por nada. El hook ya trae un `?key=…`,
      # por eso va `&` y no `?`.
      # Ojo: Render RECONSTRUYE ese commit desde el repositorio; no usa la imagen que se publicó
      # en ghcr.io. Se despliega el commit verificado, no la imagen verificada (eso lo cierra el TP7).
      - name: Disparar deploy en Render (backend + front) del commit verificado
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          curl -fsS --max-time 30 "$HOOK_API&ref=$GITHUB_SHA"
          curl -fsS --max-time 30 "$HOOK_FRONT&ref=$GITHUB_SHA"

      # Reintenta (30 x 20 s) porque el plan gratis de Render duerme el servicio y tarda en
      # construir y despertar (cold start). Un curl seco daría falsos rojos. Verifica tres cosas:
      #   1. /health del backend: el proceso vive Y la base responde (200).
      #   2. el front sirve la página (200).
      #   3. el front llega al backend por el proxy de nginx: /api/empleados SIN token tiene que
      #      contestar 401 (si el proxy estuviera roto daría 502/504/404).
      # Limitación: el hook responde al instante y Render construye en segundo plano; mientras
      # construye (o si ese build falla) sigue sirviendo la versión ANTERIOR, así que este smoke
      # puede dar verde contra la versión vieja. Prueba que el entorno contesta, no qué versión corre.
      - name: Smoke test (espera a que QA conteste)
        shell: bash
        env:
          URL_API: https://pagina-ing3-api-qa.onrender.com
          URL_FRONT: https://pagina-ing3-front-qa.onrender.com
        run: |
          echo "Esperando a que QA esté vivo..."
          for i in $(seq 1 30); do
            api=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL_API/health" || true)
            front=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL_FRONT/" || true)
            proxy=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL_FRONT/api/empleados" || true)
            echo "intento $i: health=$api front=$front proxy=$proxy"
            if [ "$api" = "200" ] && [ "$front" = "200" ] && [ "$proxy" = "401" ]; then
              echo "✅ QA responde (API + BD + front + proxy)"; exit 0
            fi
            sleep 20
          done
          echo "❌ QA no respondió a tiempo"; exit 1

  # --- Promoción a PRODUCCIÓN: la misma cadena, con una puerta humana ---
  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-qa                           # a producción sólo llega lo que ya pasó por QA
    if: github.ref == 'refs/heads/main'
    environment: production                    # acá está la aprobación: el job queda en "Waiting" hasta que un reviewer la dé
    concurrency:
      group: deploy-production                 # un solo deploy a producción a la vez
      cancel-in-progress: false                # no se cancela uno en curso: se encolan
    steps:
      # Mismo commit que pasó por CI y QA (&ref=$GITHUB_SHA), no la punta de la rama.
      # Si el reviewer rechaza, estos pasos no corren y producción queda intacta.
      - name: Disparar deploy en Render (backend + front) del commit aprobado
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          curl -fsS --max-time 30 "$HOOK_API&ref=$GITHUB_SHA"
          curl -fsS --max-time 30 "$HOOK_FRONT&ref=$GITHUB_SHA"

      # Mismo smoke test que en QA (reintenta por el cold start), contra las URLs de producción.
      - name: Smoke test (espera a que PROD conteste)
        shell: bash
        env:
          URL_API: https://pagina-ing3-api-prod.onrender.com
          URL_FRONT: https://pagina-ing3-front-prod.onrender.com
        run: |
          echo "Esperando a que PROD esté vivo..."
          for i in $(seq 1 30); do
            api=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL_API/health" || true)
            front=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL_FRONT/" || true)
            proxy=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL_FRONT/api/empleados" || true)
            echo "intento $i: health=$api front=$front proxy=$proxy"
            if [ "$api" = "200" ] && [ "$front" = "200" ] && [ "$proxy" = "401" ]; then
              echo "✅ PROD responde (API + BD + front + proxy)"; exit 0
            fi
            sleep 20
          done
          echo "❌ PROD no respondió a tiempo"; exit 1
