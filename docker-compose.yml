services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lasmelis
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: lasmelis
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lasmelis"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=lasmelis;Username=lasmelis;Password=${DB_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: LasMelisApi
      Jwt__Audience: LasMelisClient
      Frontend__Origin: "http://localhost:3000"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:8080/api"
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
